name: Daily Beijing Weather Forecast

on:
  schedule:
    # 每天北京时间 08:12（UTC 00:12）
    - cron: "12 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Configure git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Fetch forecast, commit and push
        run: python3 update_weather.py
